[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotnav"
version = "0.1.0"
description = "RGB-only panoramic image-goal navigation for Habitat-GS"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "kornia>=0.7",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "torchvision>=0.15",
]

[tool.setuptools]
py-modules = ["main", "navigation", "habitat_gs"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.setuptools.package-data]
"modules.Panoramic_Place_Compass.runtime" = ["arrival_protocol.json"]
